# tree-heavy - single --tree pass with full command-line capture, wrapped
# in a 3600s timeout -- not because ptrace tracing itself is slower, but
# because an hour's worth of process-tree records is already more data than
# is practical to publish/browse; the counter passes' own output stays
# small regardless of runtime, so those are left unbounded and allowed to
# run long if the workload does.
#
# workload/*/run_test.sh used to wrap only this one wspy invocation in
# `timeout 3600`, never the others -- not because ptrace tracing runs
# slower, but because losing a key ptrace event for a traced process can
# leave wspy hung waiting to clean up; the timeout is a hang backstop, not
# primarily a data-volume cap. This pass's own timeout is left unset here
# -- sized after the profile/config is fully loaded, from an actual
# per-workload estimate when one can be derived, falling back to this same
# 3600s constant otherwise (see wspy-run's estimate_tree_pass_timeouts()).
#
# ${OUTDIR}/${PREFIX} are substituted by wspy-run's builtin-profile loader
# at load time (the only two variables any profile file uses) -- unlike a
# user's own -c config file, which takes its flags fully literally.
tree --tree ${OUTDIR}/${PREFIX}process.tree.txt --tree-cmdline --counters=software --no-ipc
