# deep-cpu - systemtime/amdtopdown (--interval) plus one --passes sweep
# covering software/branch/ipc/topdown2/cache2/float/topdown-frontend/
# topdown-optlb, used for topdown characterization.
#
# The five non-interval counter passes this profile used to run as five
# separate wspy invocations (software_branch, ipc_topdown, l2_float,
# frontend, opcache) now collapse onto one native --passes invocation
# (wspy.c's run_multipass(), INVESTIGATION.md's 4.1 Tier 1 "Native
# multi-pass counter execution" item) -- wspy itself bin-packs them into
# however many hardware-PMU-fitting sub-passes are needed and merges the
# result into one CSV/manifest record, instead of wspy-run gluing five
# separate output files together after the fact. systemtime/amdtopdown stay
# separate: --passes has no defined merge semantics for --interval's
# periodic ticks (each pass is a separately-timed re-execution of the
# workload), so those two keep their own wspy invocation same as before. No
# --csv here (matching the five passes it replaces) -- human-readable
# output still flows into summary.txt alongside systemtime/amdtopdown's own
# output. cache3 (L3 hit/miss) and memory (local/remote data-cache-refill
# locality) were audited in and added here: cache3 uses AMD's L3 uncore PMU
# budget (excluded from preflight's general-purpose slot count, so it's
# effectively free); memory's raw events carry their own
# requires=/sys/devices/system/node/node1 gate (topdown.c) so on a
# single-NUMA-node host (most client/APU parts) the group is a real
# zero-cost skip rather than a pass spent measuring a number that can only
# ever read as "100% local". --power rides along on systemtime (not the
# --passes sweep, which fatals against --power -- it's a separate
# system-wide RAPL PMU with no multi-pass merge semantics, same reasoning
# as IBS) rather than amdtopdown: systemtime already opens zero hardware
# counters, so --power is a genuinely free addition there, and it lands
# pkg_watts/pkg_joules in the same CSV as cpu/freq -- exactly what
# wspy-plot's power-vs-utilization/power-vs-frequency dual-axis templates
# pair it against.
systemtime --csv --interval 1 --no-rusage --no-software --system --no-ipc --power
counters --passes=software,branch,ipc,topdown2,cache2,cache3,memory,float,topdown-frontend,topdown-optlb
amdtopdown --csv --interval 1 --counters=topdown --no-rusage --no-software --no-ipc
