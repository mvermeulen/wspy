# checklist-flags.conf -- boolean checklist-option -> wspy flag mappings for the web launcher's
# configuration checklist (build_configuration_passes(), web/joblib.py), for the sub-options that
# are a pure 1:1 "checkbox checked -> emit this one flag" mapping. Read by
# joblib._load_checklist_flag_table() the same "<tokens...>", "#"-comment-tolerant way wspy-run's
# own profiles/*.conf pass lists are (see _load_profile_conf_passes() in the same file) --
# INVESTIGATION.md 4.4(a) item 1's "Preset/Configuration/Option vocabulary refactor", first slice
# of its "unify the checklist's own argv builder onto declarative data instead of a hardcoded
# Python if-chain" remaining scope.
#
# NOT read by wspy-run itself, and not the same grammar as a *.conf pass list above -- wspy-run's
# presets are fixed flag lists decided once at profile-load time, with no checkbox concept at all,
# so there is no way to make this literally the same file format. This is a sibling data source in
# the same declarative spirit: build_configuration_passes() consults it instead of one `if
# section.get(<key>): flags.append(<flag>)` block per option, same as wspy-run's own builtin
# profiles moved off hardcoded PASS_NAMES/PASS_FLAGS bash arrays onto *.conf files. Genuinely
# conditional, non-mechanical checklist logic (interval/--passes bin-packing choice, --power
# folding, the "amdtopdown"/"systemtime" legacy-name heuristics, --target/--symbol-sample value
# passthrough) stays real code in build_configuration_passes() -- forcing that into a flat table
# would obscure it, not simplify it.
#
# <checklist-key> <option-key> <flag>
#
# "tree" section (proctree.c's --tree-* flags; order matches build_configuration_passes()'s
# original hand-written if-chain, preserved here so this refactor changes no observable flag order):
tree cmdline --tree-cmdline
tree open --tree-open
tree futex --tree-futex
tree io --tree-io
tree io_wait --tree-io-wait
tree schedstat --tree-schedstat
tree vmsize --tree-vmsize
tree connect --tree-connect
tree wait --tree-wait
tree poll --tree-poll
tree nanosleep --tree-nanosleep
#
# "gpu" section (one of these four selects which backend(s) collect data at all --
# build_configuration_passes() still skips the whole pass if none are checked):
gpu busy --gpu-busy
gpu metrics --gpu-metrics
gpu smi --gpu-smi
gpu nvidia --gpu-nvidia
