# deep-cpu-intel - systemtime/inteltopdown (--interval) plus one --passes sweep
# covering software/branch/ipc/topdown2/cache2/topdown-backend, used for
# Intel topdown characterization.
#
# The non-interval counter passes this profile used to run as four separate
# wspy invocations (software_branch, topdown, ipc_l2, backend) now collapse onto
# one native --passes invocation (wspy.c's run_multipass()), bin-packed by wspy
# into PMU-fitting sub-passes and merged into one CSV/manifest record.
# systemtime and inteltopdown stay separate passes with --interval 1 for periodic
# telemetry and gnuplot generation (wspy-plot renders plots/inteltopdown.topdown.png,
# plots/systemtime.system-cpu.png, plots/systemtime.power-vs-frequency.png, etc.).
systemtime --csv --interval 1 --no-rusage --no-software --system --no-ipc --power
counters --csv --passes=software,branch,ipc,topdown2,cache2,topdown-backend
inteltopdown --csv --interval 1 --counters=topdown --no-rusage --no-software --no-ipc

