# deep-cpu-intel - the Intel-only equivalent of deep-cpu (software/branch,
# topdown, ipc/l2, backend) -- Intel doesn't have deep-cpu's AMD-specific
# opcache/frontend/l3 groups, so this is a separate, shorter sweep.
#
# All four passes carry --csv (issue #274, same fix as deep-cpu.conf's own
# counters pass, but this profile had it worse: none of its four separate
# single-pass invocations ever collected --csv at all, so wspy-store never
# ingested any of this profile's metric_values -- every run_features row
# for every deep-cpu-intel run has landed coverage=unavailable since the
# axis existed). wspy-run's auto-derived --text-out companion (run_pass())
# keeps each pass's own human-readable form flowing into summary.txt, same
# as before.
software_branch --csv --rusage --counters=software,branch --no-ipc
topdown --csv --counters=topdown2 --no-rusage --no-software --no-ipc
ipc_l2 --csv --counters=ipc,cache2 --no-rusage --no-software
backend --csv --no-ipc --no-rusage --counters=topdown-backend
