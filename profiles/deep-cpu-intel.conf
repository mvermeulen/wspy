# deep-cpu-intel - the Intel-only equivalent of deep-cpu (software/branch,
# topdown, ipc/l2, backend) -- Intel doesn't have deep-cpu's AMD-specific
# opcache/frontend/l3 groups, so this is a separate, shorter sweep.
software_branch --rusage --counters=software,branch --no-ipc
topdown --counters=topdown2 --no-rusage --no-software --no-ipc
ipc_l2 --counters=ipc,cache2 --no-rusage --no-software
backend --no-ipc --no-rusage --counters=topdown-backend
