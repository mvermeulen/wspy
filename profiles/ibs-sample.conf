# ibs-sample - single pass: AMD IBS *sampling* mode (--ibs-sample, distinct
# from ibs-basic/ibs-memory-deep's counting mode) -- decodes each sample's
# IbsOpData2 memory-data-source field into a named cache/DRAM hierarchy
# breakdown (which level a load actually resolved from), not just a
# filtered/unfiltered sample count.
#
# Two reasons this pass omits flags the counting-mode ones above use: no
# --interval, since ibs_sample.c only drains its ring buffer once at
# end-of-run -- combined with --interval every periodic row reads 0 and
# only the final row is populated, so --interval buys nothing here and
# would just be misleading; no --csv, since the named per-level breakdown
# (print_ibs_sample_data_src_breakdown()) only prints in human-readable
# output -- CSV mode only carries two scheme-independent numeric columns
# (dram_rate/remote_node_rate), not the full named table. No --csv also
# means wspy-run gives this pass a .txt output file.
ibs --ibs-sample --no-ipc
