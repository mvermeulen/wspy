# deep-gpu - deep-cpu plus GPU busy/metrics (--interval) passes (needs an
# AMDGPU=1 build to collect real data; passes still run otherwise since
# wspy itself just warns per pass and continues).
#
# deep-cpu's CPU sweep, collapsed onto --passes the same way -- see that
# profile's own comment -- plus the two GPU interval passes, which (like
# systemtime/amdtopdown) stay their own wspy invocation since --passes
# doesn't cover --interval. systemtime carries --power for the same reason
# deep-cpu's does: it already opens zero hardware counters, so --power is a
# free addition there, landing pkg_watts/pkg_joules in the same CSV as
# cpu/freq for wspy-plot's power-vs-utilization/power-vs-frequency
# templates -- this was a pre-existing asymmetry between the two profiles,
# not a deliberate omission (INVESTIGATION.md's "4.2 -- remaining work").
systemtime --csv --interval 1 --no-rusage --no-software --system --no-ipc --power
counters --passes=software,branch,ipc,topdown2,cache2,cache3,memory,float,topdown-frontend,topdown-optlb
amdtopdown --csv --interval 1 --counters=topdown --no-rusage --no-software --no-ipc
gpu_busy --csv --interval 1 --gpu-busy --no-ipc --no-rusage --no-software
gpu_metrics --csv --interval 1 --gpu-metrics --no-ipc --no-rusage --no-software
