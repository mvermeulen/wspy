## default_curation.conf -- policy for the curation studio's "Apply default
## curation" button (server.py:build_default_curation_blocks()).
##
## One entry per line, top to bottom, in the exact order those artifacts
## should appear in the curated block sequence. An entry is either a literal
## run-directory-relative filename ("command.txt", "plots/amdtopdown.topdown.png")
## or a glob pattern (fnmatch rules -- "*"/"?"/"[...]") for artifacts whose
## name varies per run, e.g. an AI model name.
##
## A line starting with "#" followed directly by a pattern is a *documented
## exclusion*: the artifact is known/expected but left out of the default
## curation. Delete the "#" (and adjust its position in the file) to opt it
## back in -- that's the whole point of this being a plain list rather than
## hardcoded in server.py. A line starting with "##" (like this one) is a
## pure comment/section header, never a pattern. An inline "  # ..." after a
## pattern is a trailing note, not part of the pattern itself.
##
## Only an artifact present in the run is ever actually added -- a listed but
## absent file (e.g. no AI narrative generated yet) is silently skipped, not
## an error. Artifacts this file doesn't mention at all (a pass output from a
## profile not covered here, a plot template not covered here, additional AI
## narrative variants) still get appended after everything below, same as
## before this file existed -- this file curates known/common cases, it
## doesn't gate what can show up.
##
## AI vision analysis of a plot (wspy-analyze --image, aivision.<image-stem>.
## <model>.md) is always placed immediately after that same plot's own entry
## below, never grouped into one block elsewhere -- a reader should see the
## chart, then its narration, not a narration with no chart nearby (or
## worse, several narrations bunched together before any of their charts).
## Each plot below that has a dedicated vision prompt template
## (prompts/vision_<name>.tmpl -- see wspy-analyze's
## VISION_TEMPLATE_BY_PLOT_TEMPLATE) gets this treatment; a plot with no such
## template has no aivision.* entry to place, since wspy-analyze --image has
## nothing to auto-select for it.
##
## Filenames below match the "zen4plus-deep" wspy-run profile (systemtime/
## counters/amdtopdown/ibs/tree passes) -- the first profile this default was
## tuned against. Extend this file as other profiles get curated for real.

## --- command line + system/CPU headline plot -------------------------
command.txt
plots/systemtime.system-cpu.png
## AI vision analysis of the chart just above. Matches any model name; not
## present until wspy-analyze --image plots/systemtime.system-cpu.png has
## been run for this rundir, in which case it's silently skipped, not an
## error. wspy-analyze writes .md now (rendered as real HTML, not dumped
## verbatim); the .txt line stays for runs from before that change. The
## rendered prompt/critique are excluded, same "not curation-worthy on their
## own" reasoning as the narrative-analysis section below.
aivision.systemtime.system-cpu.*.md
aivision.systemtime.system-cpu.*.txt
# aiprompt.vision.systemtime.system-cpu.md
# aiprompt.vision.systemtime.system-cpu.txt
# aiprompt.critique.vision.systemtime.system-cpu.*.md
# aiprompt.critique.vision.systemtime.system-cpu.*.txt

## --- raw per-pass text output ------------------------------------------
counters.txt
ibs.txt
# systemtime.csv  # raw per-tick CSV -- superseded by the curated systemtime plots below
# amdtopdown.csv  # raw per-tick CSV -- superseded by the curated amdtopdown plots below
# tree.txt        # --tree pass's own software-counter capture -- process.tree.* views below are the readable form
# summary.txt     # concatenation of every pass's raw output -- redundant with the per-pass blocks above

